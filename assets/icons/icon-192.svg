<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <!-- Fondo PWA -->
    <linearGradient id="bg192" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c162b"/>
      <stop offset="100%" stop-color="#0c0814"/>
    </linearGradient>
    
    <!-- Gradiente Dorado -->
    <linearGradient id="gold192" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#7F5300"/>
    </linearGradient>

    <!-- Gradiente Gema Central -->
    <linearGradient id="ruby192" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>

    <!-- Sombra -->
    <filter id="shadow192" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Fondo Maskable (Cubre el 100%) -->
  <rect width="192" height="192" fill="url(#bg192)"/>

  <!-- Amuleto (Dentro de la Safe Zone) -->
  <g filter="url(#shadow192)">
    <!-- Marco Dorado Exterior -->
    <circle cx="96" cy="96" r="56" fill="url(#gold192)" stroke="#FFF3C4" stroke-width="2"/>
    <circle cx="96" cy="96" r="48" fill="none" stroke="#523600" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="96" cy="96" r="42" fill="#26180B" stroke="#FFB300" stroke-width="2"/>

    <!-- 5 Gemas del Amuleto -->
    <circle cx="96" cy="62" r="5" fill="#FF2A2A" stroke="#FFF" stroke-width="1"/>
    <circle cx="123" cy="71" r="5" fill="#00E676" stroke="#FFF" stroke-width="1"/>
    <circle cx="113" cy="106" r="5" fill="#29B6F6" stroke="#FFF" stroke-width="1"/>
    <circle cx="79" cy="106" r="5" fill="#AB47BC" stroke="#FFF" stroke-width="1"/>
    <circle cx="69" cy="71" r="5" fill="#E0F7FA" stroke="#FFF" stroke-width="1"/>

    <!-- Gema Central -->
    <circle cx="96" cy="96" r="20" fill="url(#ruby192)" stroke="#FFD54F" stroke-width="2"/>
    
    <!-- Reloj de Arena / Brillo central -->
    <path d="M90 87h12l-4 9 4 9H90l4-9-4-9z" fill="#FFF" opacity="0.9"/>
  </g>
</svg>
