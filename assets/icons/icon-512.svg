<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Fondo PWA -->
    <linearGradient id="bg512" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c162b"/>
      <stop offset="100%" stop-color="#0c0814"/>
    </linearGradient>

    <!-- Gradiente Dorado -->
    <linearGradient id="gold512" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#7F5300"/>
    </linearGradient>

    <!-- Gradiente Gema Central -->
    <linearGradient id="ruby512" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="100%" stop-color="#990000"/>
    </linearGradient>

    <!-- Sombra -->
    <filter id="shadow512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Fondo Maskable (Cubre el 100%) -->
  <rect width="512" height="512" fill="url(#bg512)"/>

  <!-- Amuleto (Dentro de la Safe Zone) -->
  <g filter="url(#shadow512)">
    <!-- Marco Dorado Exterior -->
    <circle cx="256" cy="256" r="150" fill="url(#gold512)" stroke="#FFF3C4" stroke-width="5"/>
    <circle cx="256" cy="256" r="128" fill="none" stroke="#523600" stroke-width="4" stroke-dasharray="10 8"/>
    <circle cx="256" cy="256" r="112" fill="#26180B" stroke="#FFB300" stroke-width="5"/>

    <!-- 5 Gemas del Amuleto -->
    <!-- Gema 1: Ruby (Top) -->
    <circle cx="256" cy="165" r="13" fill="#FF2A2A" stroke="#FFF" stroke-width="2.5"/>
    <!-- Gema 2: Esmeralda -->
    <circle cx="328" cy="189" r="13" fill="#00E676" stroke="#FFF" stroke-width="2.5"/>
    <!-- Gema 3: Zafiro -->
    <circle cx="301" cy="282" r="13" fill="#29B6F6" stroke="#FFF" stroke-width="2.5"/>
    <!-- Gema 4: Amatista -->
    <circle cx="211" cy="282" r="13" fill="#AB47BC" stroke="#FFF" stroke-width="2.5"/>
    <!-- Gema 5: Diamante -->
    <circle cx="184" cy="189" r="13" fill="#E0F7FA" stroke="#FFF" stroke-width="2.5"/>

    <!-- Gema Central -->
    <circle cx="256" cy="256" r="54" fill="url(#ruby512)" stroke="#FFD54F" stroke-width="5"/>

    <!-- Reloj de Arena / Símbolo Central -->
    <path d="M240 232h32l-11 24 11 24h-32l11-24-11-24z" fill="#FFF" opacity="0.95"/>
  </g>
</svg>
