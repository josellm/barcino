<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3a1f14;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#5a2f1a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2a1408;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="robe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6b2a1a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#3a1408;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="parchment" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5e6c8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#d4c090;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="light" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#f0d060;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#f0d060;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- Warm light overlay -->
  <rect width="1920" height="1080" fill="url(#light)"/>

  <!-- Scribe figure (simplified) -->
  <!-- Head -->
  <ellipse cx="520" cy="340" rx="70" ry="85" fill="#d4a06a"/>
  <!-- Robe body -->
  <path d="M 420 420 Q 520 440 620 420 L 640 900 Q 520 920 400 900 Z" fill="url(#robe)"/>
  <!-- Arm writing -->
  <path d="M 560 480 Q 640 500 700 540" stroke="#d4a06a" stroke-width="22" fill="none" stroke-linecap="round"/>
  <!-- Quill -->
  <line x1="690" y1="535" x2="740" y2="560" stroke="#2a1408" stroke-width="4"/>

  <!-- Empty parchment frame (centered) -->
  <g transform="translate(900, 480)">
    <!-- Frame border -->
    <rect x="-220" y="-140" width="440" height="280" rx="8" fill="#2a1408"/>
    <rect x="-210" y="-130" width="420" height="260" rx="6" fill="#1a0a04"/>
    <!-- Parchment sheet -->
    <rect x="-200" y="-120" width="400" height="240" rx="4" fill="url(#parchment)"/>
    <!-- Subtle fold lines -->
    <line x1="-200" y1="-80" x2="200" y2="-80" stroke="#c8b070" stroke-width="1" opacity="0.5"/>
    <line x1="-200" y1="-40" x2="200" y2="-40" stroke="#c8b070" stroke-width="1" opacity="0.5"/>
    <line x1="-200" y1="0" x2="200" y2="0" stroke="#c8b070" stroke-width="1" opacity="0.5"/>
    <line x1="-200" y1="40" x2="200" y2="40" stroke="#c8b070" stroke-width="1" opacity="0.5"/>
    <line x1="-200" y1="80" x2="200" y2="80" stroke="#c8b070" stroke-width="1" opacity="0.5"/>
    <!-- Placeholder text hint -->
    <text x="0" y="100" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#8a7040" font-style="italic">Your story begins here</text>
  </g>

  <!-- Decorative corner flourishes -->
  <g stroke="#8a6a30" stroke-width="3" fill="none">
    <path d="M 100 100 L 100 40 M 100 100 L 40 100"/>
    <path d="M 1820 100 L 1820 40 M 1820 100 L 1880 100"/>
    <path d="M 100 980 L 100 1040 M 100 980 L 40 980"/>
    <path d="M 1820 980 L 1820 1040 M 1820 980 L 1880 980"/>
  </g>
</svg>